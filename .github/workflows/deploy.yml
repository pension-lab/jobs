# 매일 아침 고용24 공고를 새로 받아 GitHub Pages 로 배포
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 공고 받기
        env:
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
        run: |
          if [ -n "$WORK24_AUTH_KEY" ]; then python3 fetch_jobs.py; else echo "키 없음: 저장된 jobs.json 그대로 배포"; fi
      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp index.html jobs.html jobs.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
