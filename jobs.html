<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건보료 줄이는 일자리</title>
<meta name="description" content="50세 이상 우대 채용공고 중 회사 건강보험 가입 가능성이 있는 일자리를 모아, 공고마다 내 건보료 변화를 계산해 봅니다.">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --soft:#ede5d6; --ink:#1f2a24; --muted:#5f665f;
  --brand:#1b4a36; --leaf:#5a9150; --warn:#a1501c; --line:#d9cfbc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a16; --card:#1c241f; --soft:#26302a; --ink:#ece7dc; --muted:#a8ada5;
    --brand:#8fd0a8; --leaf:#8cc27f; --warn:#f0a36b; --line:#36423a;
  }
}
:root[data-theme="dark"]{
  --bg:#141a16; --card:#1c241f; --soft:#26302a; --ink:#ece7dc; --muted:#a8ada5;
  --brand:#8fd0a8; --leaf:#8cc27f; --warn:#f0a36b; --line:#36423a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:19px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
nav a{flex:1 1 40%;text-align:center;padding:10px;border-radius:10px;border:2px solid var(--line);
  color:var(--brand);text-decoration:none;font-weight:700;min-height:48px}
nav a[aria-current=page]{background:var(--brand);border-color:var(--brand);color:var(--card)}
.brand{color:var(--brand);font-weight:800;letter-spacing:.02em;font-size:16px}
h1{font-size:30px;line-height:1.3;margin:6px 0 8px;color:var(--brand)}
.lede{color:var(--muted);margin:0 0 16px}
.banner{background:var(--soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:17px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
select{width:100%;font:inherit;font-size:18px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.check{display:flex;align-items:center;gap:8px;grid-column:1/-1;font-weight:700;min-height:44px}
.check input{width:24px;height:24px;accent-color:var(--brand)}
.count{color:var(--muted);font-size:16px;margin:4px 0 8px}
.job{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.job h2{font-size:21px;margin:4px 0 2px;line-height:1.35}
.meta{color:var(--muted);font-size:16px}
.pay{font-size:24px;font-weight:800;margin:6px 0}
.badge{display:inline-block;font-size:15px;font-weight:700;border-radius:999px;padding:2px 10px}
.b-likely{background:var(--brand);color:var(--card)}
.b-check{background:var(--soft);color:var(--ink)}
.b-unlikely{background:var(--soft);color:var(--warn)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions a{flex:1 1 45%;text-align:center;padding:10px;border-radius:10px;font-weight:700;text-decoration:none;min-height:48px}
.primary{background:var(--brand);color:var(--card)}
.secondary{border:2px solid var(--line);color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:32px 0}
.foot{font-size:15px;color:var(--muted);margin-top:24px}
@media (max-width:480px){ body{font-size:18px} h1{font-size:26px} .filters{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
<div class="brand">연금랩 · PENSION LAB</div>
<nav>
  <a href="index.html">건보료 계산기</a>
  <a href="jobs.html" aria-current="page">일자리 보기</a>
</nav>
<h1>건보료 줄이는 일자리</h1>
<p class="lede">50세 이상 우대 공고 중에서, 회사 건강보험(월 60시간 이상)에 들어갈 가능성이 있는 일자리를 모았어요. 공고마다 내 건보료가 얼마나 바뀌는지 바로 계산해 볼 수 있어요.</p>
<div id="banner"></div>

<div class="filters">
  <select id="region" aria-label="지역"><option value="">전체 지역</option></select>
  <select id="sort" aria-label="정렬">
    <option value="closes">마감 가까운 순</option>
    <option value="pay">월급 높은 순</option>
    <option value="new">새로 올라온 순</option>
  </select>
  <label class="check"><input type="checkbox" id="onlyLikely" checked> 회사 건강보험 가능성 높은 일자리만</label>
</div>
<div class="count" id="count"></div>
<div id="list"></div>

<p class="foot">공고 출처: 고용24 채용정보 Open-API · <span id="updated"></span><br>
지원은 각 공고의 고용24 페이지에서 해요. 근무시간·4대보험 가입 여부는 공고 상세와 면접에서 꼭 확인하세요. "가능성"은 월급으로 추정한 값이에요(2026년 최저임금 × 월 60시간 ≈ 62만 원 이상).</p>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var DATA = null;
  var BADGE = {
    likely: ['b-likely', '회사 건강보험 가능성 높음'],
    check: ['b-check', '근무시간 확인 필요'],
    unlikely: ['b-unlikely', '60시간 미만일 수 있음']
  };
  function esc(s){return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function manwon(w){ return Math.round(w / 10000).toLocaleString("ko-KR") + "만 원"; }
  function payLabel(j){
    if (j.monthly_wage) return "월 " + manwon(j.monthly_wage) + (j.max_pay > j.min_pay && j.pay_type === "월급" ? " ~ " + manwon(j.max_pay) : "");
    return (j.pay_type || "") + " " + (j.pay_text || "");
  }
  function region1(r){ return (r || "").split(/\s+/)[0]; }
  function daysLeft(d){
    var t = Date.parse(d); if (!isFinite(t)) return "";
    var n = Math.ceil((t - Date.now()) / 86400000);
    return n >= 0 ? "마감 " + n + "일 전" : "마감";
  }

  function render(){
    var reg = $("region").value, only = $("onlyLikely").checked, sort = $("sort").value;
    var jobs = DATA.jobs.filter(function(j){
      return (!reg || region1(j.region) === reg) && (!only || j.health_insurance === "likely");
    });
    jobs.sort(function(a, b){
      if (sort === "pay") return (b.monthly_wage || 0) - (a.monthly_wage || 0);
      if (sort === "new") return String(b.registered).localeCompare(String(a.registered));
      return String(a.closes).localeCompare(String(b.closes));
    });
    $("count").textContent = "공고 " + jobs.length + "건";
    if (!jobs.length){
      $("list").innerHTML = '<div class="empty">조건에 맞는 공고가 없어요. 지역을 넓히거나 위 체크를 풀어 보세요.</div>';
      return;
    }
    $("list").innerHTML = jobs.map(function(j){
      var b = BADGE[j.health_insurance] || BADGE.check;
      var calc = "index.html" + (j.monthly_wage ? "?wage=" + Math.round(j.monthly_wage / 10000) : "") + "#result";
      var view = j.url
        ? '<a class="secondary" href="' + esc(j.url) + '" target="_blank" rel="noopener">공고 보기 (고용24)</a>'
        : '<a class="secondary" aria-disabled="true">예시 공고</a>';
      return '<article class="job">' +
        '<span class="badge ' + b[0] + '">' + b[1] + '</span>' +
        '<h2>' + esc(j.title) + '</h2>' +
        '<div class="meta">' + esc(j.company) + ' · ' + esc(j.region) + '</div>' +
        '<div class="pay">' + esc(payLabel(j)) + '</div>' +
        '<div class="meta">' + [j.holiday, j.career && "경력 " + j.career, daysLeft(j.closes)].filter(Boolean).map(esc).join(" · ") + '</div>' +
        '<div class="actions"><a class="primary" href="' + calc + '">내 건보료 계산</a>' + view + '</div>' +
        '</article>';
    }).join("");
  }

  fetch("jobs.json", {cache: "no-cache"}).then(function(r){ return r.json(); }).then(function(d){
    DATA = d;
    if (d.sample) $("banner").innerHTML = '<div class="banner">지금은 <b>예시 공고</b>예요. 실제 회사가 아니며, 고용24 연결 후 실제 공고로 바뀌어요.</div>';
    $("updated").textContent = "업데이트 " + String(d.updated).replace("T", " ");
    var regions = {};
    d.jobs.forEach(function(j){ var r = region1(j.region); if (r) regions[r] = 1; });
    Object.keys(regions).sort().forEach(function(r){
      var o = document.createElement("option"); o.value = r; o.textContent = r; $("region").appendChild(o);
    });
    ["region", "sort", "onlyLikely"].forEach(function(id){ $(id).addEventListener("change", render); });
    render();
  }).catch(function(){
    $("list").innerHTML = '<div class="empty">공고를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>';
  });
})();
</script>
</body>
</html>
